openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API for the Secret Santa gift exchange.
servers:
  - url: /api
tags:
  - name: auth
  - name: profile
  - name: rooms
  - name: admin
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [auth]
      summary: Check API health
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a participant account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Username is already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Sign in to an existing account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the user's profile and joined exchanges
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
  /admin/rooms:
    get:
      operationId: listAdminRooms
      tags: [admin]
      summary: List exchange rooms for the administrator
      responses:
        "200":
          description: Rooms with participant and wishlist counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoomsResponse"
    post:
      operationId: createRoom
      tags: [admin]
      summary: Create an exchange and its join code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSummary"
  /admin/rooms/{roomCode}:
    delete:
      operationId: deleteRoom
      tags: [admin]
      summary: Delete an exchange and its data
      parameters:
        - name: roomCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-HJ-NP-Z2-9]{6}$"
      responses:
        "200":
          description: Exchange deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/rooms/{roomCode}/members/{userId}:
    delete:
      operationId: deleteRoomMember
      tags: [admin]
      summary: Remove a participant before the draw
      parameters:
        - name: roomCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-HJ-NP-Z2-9]{6}$"
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Participant removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Room or participant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Participants cannot be removed after the draw
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomCode}:
    get:
      operationId: getRoom
      tags: [rooms]
      summary: Get a room and its participant list
      parameters:
        - name: roomCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-HJ-NP-Z2-9]{6}$"
      responses:
        "200":
          description: Room detail for the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDetail"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomCode}/join:
    post:
      operationId: joinRoom
      tags: [rooms]
      summary: Join an exchange using its code
      parameters:
        - name: roomCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-HJ-NP-Z2-9]{6}$"
      responses:
        "200":
          description: Joined room detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDetail"
        "409":
          description: Room is closed to new participants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomCode}/wishlist:
    put:
      operationId: updateWishlist
      tags: [rooms]
      summary: Save the current user's gift wishlist
      parameters:
        - name: roomCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-HJ-NP-Z2-9]{6}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WishlistInput"
      responses:
        "200":
          description: Saved wishlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wishlist"
  /rooms/{roomCode}/draw:
    post:
      operationId: drawRoom
      tags: [admin]
      summary: Randomly assign one recipient to each participant
      parameters:
        - name: roomCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-HJ-NP-Z2-9]{6}$"
      responses:
        "200":
          description: Draw completed without exposing assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSummary"
        "409":
          description: At least two participants are required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomCode}/reset:
    post:
      operationId: resetRoomDraw
      tags: [admin]
      summary: Clear assignments and reopen the room
      parameters:
        - name: roomCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-HJ-NP-Z2-9]{6}$"
      responses:
        "200":
          description: Draw reset; participants and wishlists remain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSummary"
  /rooms/{roomCode}/assignment:
    get:
      operationId: getMyAssignment
      tags: [rooms]
      summary: Get only the current user's assigned recipient and wishlist
      parameters:
        - name: roomCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-HJ-NP-Z2-9]{6}$"
      responses:
        "200":
          description: The current user's assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "409":
          description: The draw has not happened yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    RegisterInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 24
          pattern: "^[A-Za-z0-9_.-]+$"
        password: { type: string, minLength: 8, maxLength: 128 }
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 24 }
        password: { type: string, minLength: 1, maxLength: 128 }
    RoomInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    WishlistInput:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 3000 }
    UserSummary:
      type: object
      required: [id, username, isAdmin]
      properties:
        id: { type: integer }
        username: { type: string }
        isAdmin: { type: boolean }
    AuthResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/UserSummary" }
    ProfileRoom:
      type: object
      required: [code, name, status, memberCount, myWishlist]
      properties:
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [open, drawn] }
        memberCount: { type: integer }
        myWishlist: { type: string }
    ProfileResponse:
      type: object
      required: [user, rooms]
      properties:
        user: { $ref: "#/components/schemas/UserSummary" }
        rooms:
          type: array
          items: { $ref: "#/components/schemas/ProfileRoom" }
    RoomSummary:
      type: object
      required: [code, name, status, memberCount, wishlistCount, createdAt]
      properties:
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [open, drawn] }
        memberCount: { type: integer }
        wishlistCount: { type: integer }
        createdAt: { type: string, format: date-time }
    AdminRoomsResponse:
      type: object
      required: [rooms]
      properties:
        rooms:
          type: array
          items: { $ref: "#/components/schemas/RoomSummary" }
    RoomMember:
      type: object
      required: [id, username, joinedAt, hasWishlist]
      properties:
        id: { type: integer }
        username: { type: string }
        joinedAt: { type: string, format: date-time }
        hasWishlist: { type: boolean }
    RoomDetail:
      type: object
      required: [room, members, isMember, myWishlist]
      properties:
        room: { $ref: "#/components/schemas/RoomSummary" }
        members:
          type: array
          items: { $ref: "#/components/schemas/RoomMember" }
        isMember: { type: boolean }
        myWishlist: { type: string }
    Wishlist:
      type: object
      required: [roomCode, text, updatedAt]
      properties:
        roomCode: { type: string }
        text: { type: string }
        updatedAt: { type: string, format: date-time }
    Assignment:
      type: object
      required: [roomCode, recipient, wishlist]
      properties:
        roomCode: { type: string }
        recipient:
          type: object
          required: [id, username]
          properties:
            id: { type: integer }
            username: { type: string }
        wishlist: { $ref: "#/components/schemas/Wishlist" }
